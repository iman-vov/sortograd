<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#BDE2F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сортоград">
<meta name="description" content="Затишна ізометрична гра: збирай цеглини, сортуй їх і відбудовуй містечко.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Сортоград</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed isometric town; HUD floats in corners; labels hover over buildings; upgrade tree opens as a blueprint sheet */
:root{
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1D2840; --ink-2:#55627C; --ink-3:#8793AA;
  --paper:#FFFFFF; --paper-2:#F2F6FC; --line:#D4DEEC;
  --blue:#2E6BD6; --blue-2:#E2EBFB; --blue-ink:#163E86;
  --coin:#F2B632; --coin-ink:#7A5200; --star:#F0A21A; --idea:#7D55E8;
  --good:#2C9B58; --good-2:#E3F4E9; --warn:#E06A32; --sun:#FFD24A;
  --bp-bg:#E9F1FC; --bp-grid:#CFDDF2; --bp:#2B5FAF;
  --f-display:'Unbounded','Rubik',system-ui,sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --shadow:0 2px 0 rgba(29,40,64,.12),0 6px 18px rgba(29,40,64,.10);
  color-scheme: light;
}
html{height:100%;box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:#BDE2F4;color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;touch-action:manipulation}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 45%,transparent 60%,rgba(29,40,64,.22) 100%)}
#fx,#radar,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#hud{position:absolute;inset:0;pointer-events:none;padding-left:var(--gl);padding-right:var(--gr)}

.top{position:absolute;top:12px;left:var(--gl);right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.res{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
.pill{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 8px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);font:700 15px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill svg{width:26px;height:26px;flex:none}
.pill.dist{font:600 13px/1 var(--f-body);color:var(--ink-2);padding:0 14px}
.pill.net{font:600 12px/1 var(--f-body);color:var(--good);padding:0 12px}
.pill.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.btns{display:flex;gap:8px;pointer-events:auto}
.ib{position:relative;width:48px;height:48px;border-radius:16px;border:0;background:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow)}
.ib svg{width:26px;height:26px}
.ib.tree{background:var(--blue);color:#fff}
.dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--warn);color:#fff;font:700 11px/20px var(--f-body);text-align:center;border:2px solid #fff}

.leftcol{position:absolute;left:var(--gl);top:62px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;pointer-events:none}
#mini{width:132px;height:132px;border-radius:50%;box-shadow:var(--shadow);background:rgba(255,255,255,.6)}
.order{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);width:220px}
.order .sw{width:30px;height:24px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.order .ot{font:500 11px/1.25 var(--f-body);color:var(--ink-2)}
.order b{display:block;font:700 12px/1.25 var(--f-display);color:var(--ink)}
.order .ob{height:6px;border-radius:3px;background:var(--paper-2);margin-top:5px;overflow:hidden}
.order .ob i{display:block;height:100%;background:var(--good)}
.order .tm{font:700 11px/1 var(--f-body);color:var(--ink-3);font-variant-numeric:tabular-nums}

#plan{position:absolute;top:66px;right:var(--gr);width:268px;pointer-events:auto;background:var(--paper);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 rgba(29,40,64,.12),0 10px 28px rgba(29,40,64,.14)}
.phead{display:flex;align-items:center;gap:6px}
.phead .nav{width:36px;height:36px;border-radius:12px;border:0;background:var(--paper-2);font:700 18px/1 var(--f-body);color:var(--ink-2);flex:none}
.ptitle{flex:1;min-width:0;text-align:center}
.pname{font:700 14px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font:500 12px/1.3 var(--f-body);color:var(--ink-2);margin-top:3px}
.pbar{height:8px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4F8EF0,var(--blue));border-radius:4px;transition:width .3s}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:10px;background:var(--paper-2);border:2px solid transparent;font:600 12px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:0}
.chip svg{width:24px;height:18px;flex:none}
.chip.c{background:var(--good-2);color:var(--good)}
.chip.st{background:var(--blue-2);color:var(--blue-ink)}
.chip.flt{border-color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:500 10.5px/1.2 var(--f-body);color:var(--ink-3)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend .l1::before{background:var(--good-2);box-shadow:inset 0 0 0 1.5px var(--good)}
.legend .l2::before{background:var(--blue-2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.primary{border:0;border-radius:14px;min-height:48px;padding:10px 14px;background:var(--blue);color:#fff;font:700 14px/1.15 var(--f-display);box-shadow:0 3px 0 var(--blue-ink)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-ink)}
.primary:disabled{background:#C9D3E3;color:#6F7C94;box-shadow:none}
.primary.ready{animation:ready 1.4s ease-in-out infinite}
.primary.go{background:#2C9B58;box-shadow:0 3px 0 #1B6B3B}
@keyframes ready{50%{box-shadow:0 3px 0 var(--blue-ink),0 0 0 6px rgba(46,107,214,.25)}}
.ghostbtn{border:2px solid var(--line);border-radius:12px;min-height:40px;padding:6px 10px;background:var(--paper);font:600 12.5px/1.2 var(--f-body);color:var(--ink-2)}
#plan.mini .needs,#plan.mini .ghostbtn,#plan.mini .legend{display:none}
.pmin{border:0;background:none;color:var(--ink-3);font:600 11px/1 var(--f-body);padding:2px;align-self:center}

.blab{position:absolute;left:0;top:0;min-width:130px;max-width:230px;padding:8px 10px 9px;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 6px 18px rgba(29,40,64,.2);font:600 12px/1.2 var(--f-body);color:var(--ink);will-change:transform}
.blab::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.96)}
.blab h4{margin:0 0 2px;font:700 12.5px/1.2 var(--f-display)}
.blab .ls{color:var(--ink-2);font-weight:500;font-size:11px;margin-bottom:6px}
.blab .cs{display:flex;flex-wrap:wrap;gap:4px}
.blab .hint{margin-top:6px;font:600 11px/1.25 var(--f-body);color:var(--coin-ink)}
.blab.hov{opacity:.9}
.mc{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 4px;border-radius:7px;background:var(--paper-2);font:700 11px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.mc i{width:14px;height:9px;border-radius:2px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.mc.s0 i{width:9px}.mc.s2 i{width:13px;height:13px}
.mc.c{background:var(--good-2);color:var(--good)}
.mc.st{background:var(--blue-2);color:var(--blue-ink)}
.ptag{position:absolute;left:0;top:0;padding:4px 8px;border-radius:9px;background:var(--good);color:#fff;font:700 11px/1 var(--f-body)}

.bottom{position:absolute;left:var(--gl);bottom:14px;display:flex;align-items:flex-end;gap:10px;pointer-events:auto;flex-wrap:wrap;max-width:calc(100% - 200px)}
.bag{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:20px;background:var(--paper);min-width:190px;box-shadow:0 2px 0 rgba(29,40,64,.12),0 8px 22px rgba(29,40,64,.12)}
.bag svg{width:36px;height:36px;flex:none}
.bag .bt{font:700 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.bag .bt span{color:var(--ink-3);font-size:13px}
.bag .bt span:first-child{color:var(--ink);font-size:16px}
.bag .bl{font:500 11px/1 var(--f-body);color:var(--ink-2);margin-bottom:5px}
.bag .bc{font:600 11px/1 var(--f-body);color:var(--coin-ink);margin-top:5px}
.bbar{display:flex;height:8px;width:120px;border-radius:4px;background:var(--paper-2);overflow:hidden;margin-top:6px}
.bbar i{display:block;height:100%;width:0;transition:width .2s}
#bagBar{background:var(--good)} #carryBar{background:var(--coin)}
.bag.full{animation:full 1s ease-in-out infinite}
.bag.full #bagBar{background:var(--warn)}
@keyframes full{50%{box-shadow:0 2px 0 rgba(29,40,64,.12),0 0 0 5px rgba(224,106,50,.3)}}
.act{position:relative;overflow:hidden;border:0;border-radius:18px;height:56px;padding:0 16px;background:var(--paper);display:flex;align-items:center;gap:8px;font:700 12px/1.1 var(--f-display);box-shadow:0 2px 0 rgba(29,40,64,.12),0 8px 22px rgba(29,40,64,.12)}
.act .cd{position:absolute;left:0;bottom:0;height:4px;background:var(--blue);width:0}
.act:disabled{opacity:.6}
#joy{position:absolute;right:calc(var(--gr) + 8px);bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.75);
  box-shadow:0 6px 20px rgba(29,40,64,.15);pointer-events:auto;touch-action:none;z-index:4}
#joy .jk{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(29,40,64,.25)}
.tip{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));padding:10px 16px;border-radius:16px;background:rgba(29,40,64,.86);color:#fff;font:500 14px/1.35 var(--f-body);text-align:center;pointer-events:none;transition:opacity .3s}
.tip:empty{opacity:0}
#toasts{position:absolute;top:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(420px,calc(100% - 32px));z-index:30}
.toast{padding:9px 16px;border-radius:14px;background:var(--paper);font:600 13.5px/1.3 var(--f-body);box-shadow:0 8px 24px rgba(29,40,64,.18);animation:tin .3s ease, tout .4s ease 2.6s forwards;text-align:center}
.toast em{font-style:normal;color:var(--idea)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.ft{position:absolute;left:0;top:0;font:800 15px/1 var(--f-display);color:#fff;text-shadow:0 2px 0 rgba(29,40,64,.45),0 0 8px rgba(29,40,64,.25);white-space:nowrap;will-change:transform}
.ft.coin{color:#FFE08A}
.ft.sm{font-size:12px}
.ft.idea{color:#E3D6FF}
.ft.bad{color:#FFD2BF;font-size:13px}
.arw{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 4px 12px rgba(29,40,64,.2)}
.arw i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--blue);transform:translateY(-1px)}
.arw.gold i{border-bottom-color:var(--star)}

#coach{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:min(480px,calc(100% - 32px));z-index:18;pointer-events:auto;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(29,40,64,.35)}
#coach .cn{font:800 11px/1 var(--f-display);background:var(--sun);color:var(--ink);border-radius:10px;padding:7px 8px;flex:none;font-variant-numeric:tabular-nums}
#coach p{margin:0;font:500 14px/1.38 var(--f-body);flex:1;min-width:0}
#coach .cb{display:flex;flex-direction:column;gap:6px;flex:none}
.cbtn{border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font:600 12px/1 var(--f-body);padding:9px 10px}
.cbtn.y{background:var(--sun);color:var(--ink)}
#coach.ontree{bottom:auto;top:78px;z-index:26}
.coach-on{animation:coachPulse 1.2s ease-in-out infinite!important}
@keyframes coachPulse{50%{box-shadow:0 0 0 5px rgba(255,210,74,.95),0 0 0 12px rgba(255,210,74,.3)}}

.ov{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(29,40,64,.38);padding:16px var(--gr) 16px var(--gl)}
.card{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(29,40,64,.3);display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font:800 22px/1.15 var(--f-display);text-wrap:balance}
.card p{margin:0;font:400 15px/1.5 var(--f-body);color:var(--ink-2)}
.card .row{display:flex;flex-wrap:wrap;gap:8px}
.card .row > *{flex:1 1 140px}
#start{background:linear-gradient(180deg,rgba(29,40,64,.12),rgba(29,40,64,.42))}
#start .card .primary{min-height:54px;font-size:16px}
.logo{font:800 clamp(34px,7vw,52px)/1 var(--f-display);letter-spacing:-.01em;color:var(--ink);display:flex;gap:2px}
.logo span:nth-child(6n+1){color:#C8553D}.logo span:nth-child(6n+2){color:#2E6BD6}.logo span:nth-child(6n+3){color:#E7A817}
.logo span:nth-child(6n+4){color:#6F7C8C}.logo span:nth-child(6n+5){color:#9B6B45}.logo span:nth-child(6n){color:#1D2840}
.kbd{font:500 12.5px/1.45 var(--f-body);color:var(--ink-3)}
.langs{display:flex;gap:6px}
.langs button{flex:1;border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:7px;font:700 12px/1 var(--f-body);color:var(--ink-2)}
.langs button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-2)}
.slide-art{height:120px;border-radius:18px;display:grid;place-items:center;font-size:58px;background:linear-gradient(160deg,#D9EEF9,#BFE2C9)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{width:22px;background:var(--blue)}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.howto li{display:flex;gap:10px;align-items:center;font:500 14px/1.35 var(--f-body);color:var(--ink-2)}
.howto b{flex:none;width:34px;height:34px;border-radius:11px;background:var(--paper-2);display:grid;place-items:center;font-size:18px}
.linkbtn{border:0;background:none;color:var(--blue);font:600 13px/1.2 var(--f-body);padding:6px;align-self:center}
.menu .ghostbtn{min-height:46px;font-size:14px;text-align:left;padding:10px 14px}
.vol{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font:600 14px/1.2 var(--f-body);color:var(--ink-2)}
.vol input{width:100%;accent-color:var(--blue);height:28px}
.vol span{font:700 12px/1 var(--f-body);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.trk{display:flex;align-items:center;gap:8px;font:500 12.5px/1.3 var(--f-body);color:var(--ink-3);margin-top:-6px}
.trk span{flex:1;min-width:0}
.menu .trk .ghostbtn{min-height:36px;font-size:12.5px;padding:6px 12px}
.menu .danger{color:var(--warn);border-color:#F3C9B5}
.code{font:800 44px/1 var(--f-display);letter-spacing:.12em;text-align:center;color:var(--blue);padding:14px;border-radius:16px;background:var(--blue-2);font-variant-numeric:tabular-nums}
.codein{width:100%;font:800 32px/1 var(--f-display);letter-spacing:.2em;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);color:var(--ink);background:var(--paper-2);user-select:text;-webkit-user-select:text}
.status{font:600 13px/1.4 var(--f-body);color:var(--ink-2)}
.status.err{color:var(--warn)}
.status.ok{color:var(--good)}

#tree{position:absolute;inset:0;z-index:15;background:var(--bp-bg);display:flex;flex-direction:column}
.thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px var(--gr) 12px var(--gl);background:var(--paper);box-shadow:0 2px 0 var(--line)}
.thead h2{margin:0 auto 0 0;font:800 18px/1.1 var(--f-display);color:var(--bp)}
.thead .pill{box-shadow:none;background:var(--paper-2)}
.tscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;position:relative}
.tsheet{position:relative;margin:0 auto;background-image:linear-gradient(var(--bp-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px);background-size:24px 24px}
.tsheet svg.lines{position:absolute;inset:0;pointer-events:none}
.bh{position:absolute;top:10px;display:flex;flex-direction:column;gap:5px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.86);border:1.5px solid var(--bp-grid)}
.bh .bn{display:flex;align-items:center;gap:6px;font:700 12.5px/1.1 var(--f-display);color:var(--bp)}
.bh .bn span{font-size:17px}
.bh .bm{font:500 11px/1.2 var(--f-body);color:var(--ink-2);font-variant-numeric:tabular-nums}
.bh .bmb{height:5px;border-radius:3px;background:var(--bp-grid);overflow:hidden}
.bh .bmb i{display:block;height:100%;background:var(--bp)}
.bh.lock{opacity:.65}
.tl{position:absolute;left:8px;width:56px;text-align:center}
.tl b{display:block;font:800 18px/1 var(--f-display);color:var(--bp)}
.tl span{display:block;font:500 10.5px/1.25 var(--f-body);color:var(--ink-2);margin-top:4px}
.tl.syn b{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.node{position:absolute;width:98px;transform:translate(-50%,-34px);display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0}
.node .disc{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:29px;line-height:1;background:#fff;border:3px solid var(--bp);box-shadow:0 3px 0 rgba(43,95,175,.25)}
.node .lv{position:absolute;bottom:-6px;right:-8px;min-width:30px;height:20px;padding:0 5px;border-radius:10px;background:#fff;border:2px solid var(--bp);font:700 10.5px/16px var(--f-body);color:var(--bp);font-variant-numeric:tabular-nums}
.node .nm{font:600 11.5px/1.15 var(--f-body);color:var(--ink);text-align:center;max-width:98px;text-wrap:balance;background:var(--bp-bg);padding:1px 4px;border-radius:6px}
.node.cap{gap:12px}
.node .pr{font:600 10.5px/1 var(--f-body);color:var(--coin-ink);font-variant-numeric:tabular-nums}
.node .pr:not(:empty){background:var(--bp-bg);padding:2px 4px;border-radius:6px}
.node .pr.c::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coin);border:1.5px solid #B9800F;margin-right:3px;vertical-align:-1px}
.node.locked .disc{background:#E6EDF7;border-color:#AFC0D8;box-shadow:none}
.node.locked .disc > span:first-child{filter:grayscale(1);opacity:.55}
.node.locked .lv{border-color:#AFC0D8;color:#7F90AA}
.node.locked .nm{color:var(--ink-3)}
.node.can .disc{border-color:var(--blue);animation:can 1.6s ease-in-out infinite}
@keyframes can{50%{box-shadow:0 3px 0 rgba(43,95,175,.25),0 0 0 7px rgba(46,107,214,.22)}}
.node.owned .disc{background:var(--bp);border-color:var(--bp)}
.node.max .disc{background:var(--bp);border-color:var(--coin);box-shadow:0 0 0 3px rgba(242,182,50,.5)}
.node.max .lv{border-color:var(--coin);color:var(--coin-ink)}
.node.forked .disc{background:#EEF2F8;border-style:dashed;border-color:#AFC0D8}
.node.forked .disc > span:first-child{filter:grayscale(1);opacity:.4}
.node.sel .disc{outline:3px solid var(--ink);outline-offset:3px}
.node.cap .disc{border-radius:20px;transform:rotate(45deg)}
.node.cap .disc > span{transform:rotate(-45deg)}
.node.cap .lv{transform:rotate(-45deg);bottom:-10px;right:-14px}
.orl{position:absolute;transform:translate(-50%,-50%);font:700 10px/1 var(--f-body);color:var(--bp);background:var(--bp-bg);padding:3px 5px;border-radius:6px;letter-spacing:.04em}
#detail{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);background:var(--paper);border-radius:22px 22px 0 0;padding:16px var(--gr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gl);box-shadow:0 -10px 40px rgba(29,40,64,.18);display:flex;flex-direction:column;gap:10px}
.dh{display:flex;gap:12px;align-items:center}
.dh .di{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--bp-bg);border:2.5px solid var(--bp);flex:none}
.dh h3{margin:0;font:700 16px/1.2 var(--f-display)}
.dh .db{font:500 12px/1.3 var(--f-body);color:var(--ink-2);margin-top:3px}
.dh .x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:0;background:var(--paper-2);font-size:18px;flex:none}
.dd{margin:0;font:400 14px/1.45 var(--f-body);color:var(--ink-2)}
.de{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 13px/1.3 var(--f-body);color:var(--ink-2)}
.de b{font:700 13px/1.2 var(--f-display);color:var(--ink);background:var(--paper-2);padding:6px 9px;border-radius:9px}
.de b.nx{background:var(--blue-2);color:var(--blue-ink)}
.dr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font:500 12.5px/1.3 var(--f-body)}
.dr li{display:flex;gap:6px;align-items:baseline}
.dr li::before{content:"✓";font-weight:700;color:var(--good);width:14px;flex:none}
.dr li.no{color:var(--warn)}
.dr li.no::before{content:"✕";color:var(--warn)}
.df{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.df .price{display:flex;gap:10px;font:700 15px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-right:auto}
.df .price span{display:flex;align-items:center;gap:4px}
.df .price svg{width:20px;height:20px}
.df .price .short{color:var(--warn)}
.df .primary{min-width:150px}

@media (max-width:640px){

}
@media (prefers-reduced-motion:reduce){

function t(k, v = {}){ let s = T[LANG][k] ?? T.uk[k] ?? k; if (Array.isArray(s)) s = pickPlural(s, v.n ?? 0); return String(s).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? ''); }

}

let miniT = 0;
function drawMini(dt){

  const x = cv.getContext('2d'), N = cv.width, R = W.Rmax + 3.8, sc = N / 2 / R * 0.96;
  const ang = Math.PI / 4 + yaw, rx = Math.cos(ang), rz = -Math.sin(ang), fx = -Math.sin(ang), fz = -Math.cos(ang);
  const mp = (wx, wz) => [N / 2 + (wx * rx + wz * rz) * sc, N / 2 - (wx * fx + wz * fz) * sc];
  x.clearRect(0, 0, N, N);

  for (let k = 0; k <= 120; k++) { const a = k / 120 * Math.PI * 2, r = W.rf(a) + 3.6, [px, py] = mp(Math.cos(a) * r, Math.sin(a) * r); k ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.closePath(); x.fill(); x.stroke();
  const poly = (x0, z0, x1, z1, fill) => { const c = [mp(x0, z0), mp(x1, z0), mp(x1, z1), mp(x0, z1)]; x.fillStyle = fill; x.beginPath(); x.moveTo(...c[0]); for (const p of c.slice(1)) x.lineTo(...p); x.closePath(); x.fill(); };
  poly(DECK.x0, DECK.z0, DECK.x1, DECK.z1, '#A97648');
  for (const b of W.buildings) { const done = S.bld[b.i] >= b.layers.length; poly(b.ox - b.hx, b.oz - b.hz, b.ox + b.hx, b.oz + b.hz, done ? '#2B5FAF' : b.i === SEL ? 'rgba(79,168,255,.85)' : 'rgba(79,168,255,.45)'); }
  const nd = getNeeds(), lv = L('v_map');
  for (const b of W.bricks) {
    if (!b.alive) continue; const [px, py] = mp(b.x, b.z);
    if (b.gold) { if (lv >= 2) { x.fillStyle = '#F2B632'; x.beginPath(); x.arc(px, py, 5, 0, 7); x.fill(); } continue; }
    const need = lv >= 2 && nd[b.t] > 0;
    x.fillStyle = MATS[tc(b.t)].hex; x.fillRect(px - (need ? 3 : 1.5), py - (need ? 3 : 1.5), need ? 6 : 3, need ? 6 : 3);

  }
  for (const h2 of W.helpers) { const [px, py] = mp(h2.g.position.x, h2.g.position.z); x.fillStyle = '#6B4426'; x.beginPath(); x.arc(px, py, 4, 0, 7); x.fill(); }
  if (REM.active) { const [px, py] = mp(REM.fig.g.position.x, REM.fig.g.position.z); x.fillStyle = '#3FA556'; x.beginPath(); x.arc(px, py, 6, 0, 7); x.fill(); }

  $('#bStart').onclick = () => { if (!LOC.intro && !hasSave) showIntro(0, true); else startGame(); };
  $('#bHow').onclick = () => showIntro(2, false);
  $('#bCoop').onclick = () => { audioInit(); openCoop(); };
}
function startGame(){
  audioInit(); Music.start(); $('#start').hidden = true; running = true; last = performance.now(); hudDirty = true;
  offlineProgress();
  if (W.buildings.every(b => S.bld[b.i] >= b.layers.length)) later(0.5, districtDone);
  else if (LOC.introD !== S.district && S.district > 1) later(0.3, showDistrictIntro);
}

/* ================= co-op (WebRTC via PeerJS) ================= */
const PEER_PREFIX = 'sortograd2-';
function loadPeer(){ return new Promise((res, rej) => { if (window.Peer) return res(); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; s.onload = () => res(); s.onerror = () => rej(new Error('lib')); document.head.appendChild(s); }); }
function netSend(m){ try { if (NET.conn && NET.conn.open) NET.conn.send(m); } catch (e) {} }
function setNet(key, err = false, v = {}){ NET.status = key ? t(key, v) : ''; NET.err = err; if (!$('#coop').hidden) coopUI(); }
function netFail(e){ const ty = e && e.type; setNet(ty === 'peer-unavailable' ? 'c.notfound' : ty === 'unavailable-id' ? 'c.taken' : 'c.fail', true); }
function attachConn(c){ NET.conn = c; c.on('data', onNet); c.on('close', onNetClose); c.on('error', () => {}); }
async function hostRoom(){
  try { setNet('c.creating'); await loadPeer(); } catch (e) { netFail(); return; }
  leaveNet(true);
  const code = String(Math.floor(1000 + Math.random() * 9000));
  const peer = new Peer(PEER_PREFIX + code); NET.peer = peer;
  peer.on('open', () => { NET.role = 'host'; NET.code = code; setNet('c.waiting'); });
  peer.on('connection', c => {
    if (NET.conn && NET.conn.open) { c.close(); return; }
    attachConn(c);
    c.on('open', () => { netSend({ k:'full', S:JSON.parse(JSON.stringify(S)) }); REM.active = true; REM.fig.g.visible = true; REM.fig.g.position.set(-1.6, 0, 1.8); toast(t('t.joined')); setNet('c.connected'); hudDirty = true; });
  });
  peer.on('error', netFail);
}
async function joinRoom(code){
  code = String(code || '').replace(/\D/g, '');
  if (code.length !== 4) { setNet('c.code4', true); return; }
  try { setNet('c.joining'); await loadPeer(); } catch (e) { netFail(); return; }
  leaveNet(true);
  const peer = new Peer(); NET.peer = peer;
  peer.on('open', () => { const c = peer.connect(PEER_PREFIX + code, { reliable:true }); attachConn(c); c.on('open', () => { NET.role = 'guest'; NET.code = code; setNet('c.gotState'); }); });
  peer.on('error', netFail);
}
function leaveNet(silent){
  const wasGuest = NET.role === 'guest';
  try { NET.conn && NET.conn.close(); } catch (e) {}
  try { NET.peer && NET.peer.destroy(); } catch (e) {}
  NET.conn = null; NET.peer = null; NET.code = '';
  if (NET.role !== 'solo') { NET.role = 'solo'; REM.active = false; REM.fig.g.visible = false; if (wasGuest) backToSolo(); }
  if (!silent) setNet('');
  hudDirty = true;
}
function backToSolo(){ ME = 0; const sv = loadSaved(); S = sv ? mergeState(sv) : DEF(); enterDistrict(); }
function onNetClose(){
  if (NET.role === 'guest') { toast(t('t.lost')); NET.role = 'solo'; NET.conn = null; try { NET.peer && NET.peer.destroy(); } catch (e) {} NET.peer = null; REM.active = false; REM.fig.g.visible = false; backToSolo(); setNet(''); }
  else if (NET.role === 'host') { toast(t('t.left')); NET.conn = null; REM.active = false; REM.fig.g.visible = false; const pl = S.pl[1]; for (let q = 0; q < 18; q++) { S.station[q] += pl.bag[q] + pl.carry[q]; pl.bag[q] = 0; pl.carry[q] = 0; } crateFillUpdate(); setNet('c.waiting'); }
  hudDirty = true;
}
function onNet(m){
  if (!m || !m.k) return;
  switch (m.k) {
    case 'full': ME = 1; S = mergeState(m.S); enterDistrict(); REM.active = true; REM.fig.g.visible = true; setNet('c.connected'); toast(t('t.inroom')); if (!running) startGame(); break;
    case 'ev': apply(m.ev); break;
    case 'act': if (NET.role === 'host') { m.ev.by = 1; apply(m.ev); netSend({ k:'ev', ev:m.ev }); } break;
    case 'pos': REM.tx = m.x; REM.tz = m.z; REM.th = m.h; REM.moving = m.m; break;
    case 'hp': if (NET.role === 'guest' && W) applyHelperSnapshot(m.l); break;
  }
}
function netTick(dt){
  if (!NET.conn || !NET.conn.open) return;
  P.netT -= dt;
  if (P.netT <= 0) { P.netT = 0.08; netSend({ k:'pos', x:+P.pos.x.toFixed(2), z:+P.pos.z.toFixed(2), h:+P.fig.g.rotation.y.toFixed(2), m:P.moving }); if (NET.role === 'host' && W.helpers.length) netSend({ k:'hp', l:helperSnapshot() }); }
}
function updateRemote(dt){
  if (!REM.active) return;
  const g = REM.fig.g, k = 1 - Math.exp(-12 * dt);
  g.position.x = lerp(g.position.x, REM.tx, k); g.position.z = lerp(g.position.z, REM.tz, k);
  let dh = REM.th - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); g.rotation.y += dh * Math.min(1, dt * 12);
  animFigure(REM.fig, dt, REM.moving, 3.3);
}
function openCoop(){ $('#coop').hidden = false; coopUI(); }
function coopUI(){
  const card = $('#coopCard'), on = NET.conn && NET.conn.open;
  const st = NET.status ? `<p class="status${NET.err ? ' err' : on ? ' ok' : ''}">${NET.status}</p>` : '';
  if (NET.role === 'host') card.innerHTML = `<h2>${t('c.title')}</h2><p>${t('c.hostP')}</p><div class="code">${NET.code}</div>${st}<button class="ghostbtn" id="cLeave">${t('c.closeRoom')}</button><button class="primary" id="cClose">${on ? t('c.play') : t('c.playSolo')}</button>`;
  else if (NET.role === 'guest') card.innerHTML = `<h2>${t('c.title')}</h2><p>${t('c.guestP', { c:NET.code })}</p>${st}<button class="ghostbtn" id="cLeave">${t('c.leave')}</button><button class="primary" id="cClose">${t('c.play')}</button>`;
  else {
    card.innerHTML = `<h2>${t('c.title')}</h2><p>${t('c.intro')}</p><button class="primary" id="cHost">${t('c.host')}</button>
      <input class="codein" id="cCode" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="code"><button class="ghostbtn" id="cJoin">${t('c.join')}</button>${st}
      <p class="kbd">${t('c.note')}</p><button class="ghostbtn" id="cClose">${t('c.back')}</button>`;
    $('#cHost').onclick = () => { audioInit(); hostRoom(); };
    $('#cJoin').onclick = () => { audioInit(); joinRoom($('#cCode').value); };
  }
  const lv = $('#cLeave'); if (lv) lv.onclick = () => { leaveNet(false); coopUI(); };
  $('#cClose').onclick = () => { $('#coop').hidden = true; if (!$('#start').hidden && NET.role !== 'solo' && !running) startGame(); };
}

/* ================= save / load ================= */
function save(){ if (!W || NET.role === 'guest') return; try { S.savedAt = Date.now(); S.ppos = [P.pos.x, P.pos.z]; localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(LOC)); } catch (e) {} }
function loadSaved(){ try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function loadLocal(){ try { const s = localStorage.getItem(LKEY); if (!s) return LDEF(); const o = JSON.parse(s); if (o.musicVol == null && o.music === false) o.musicVol = 0; if (o.sfxVol == null && o.sound === false) o.sfxVol = 0; return { ...LDEF(), ...o }; } catch (e) { return LDEF(); } }
function mergeState(o){
  const d = DEF(); if (!o) return d;
  for (const k in d) if (o[k] !== undefined) d[k] = (typeof d[k] === 'object' && d[k] && !Array.isArray(d[k]) && k !== 'order') ? { ...d[k], ...o[k] } : o[k];
  if (!Array.isArray(d.pl) || d.pl.length < 2) d.pl = [mkPl(), mkPl()];
  return d;
}
function enterDistrict(){
  buildDistrict(S.district);
  for (let k = 0; k < S.extraGold; k++) addExtraGold(k);
  const dead = new Set(S.dead); S.dead = [...dead];
  for (const b of W.bricks) if (dead.has(b.i)) { b.alive = false; setBrick(b); }
  settleAllInstant();
  for (const b of W.buildings) {
    b.placedSet = new Set(S.placed[b.i] || []);
    let li = 0; while (li < b.layers.length && b.layers[li].every(k => b.placedSet.has(k))) li++;
    S.bld[b.i] = li;
    b.P.forEach((p, k) => { if (b.placedSet.has(k)) setPlacement(b, p, true); });
    if (li >= b.layers.length) { lightWindows(b); spawnResident(b); bloomAround(b); }
  }
  const nx = W.buildings.find(x => S.bld[x.i] < x.layers.length); SEL = nx ? nx.i : 0;
  crateFillUpdate(); W.crates.forEach(c => { c.h = c.ht; c.fill.scale.y = Math.max(0.001, c.h); c.fill.position.y = 0.05 + c.h / 2; });
  P.queue.length = 0; P.path = null; P.col = null; P.placeQ = null; P.pendPlace.clear(); P.pendUnl.fill(0);
  const pp = ME === 0 && S.ppos && free(S.ppos[0], S.ppos[1]) ? S.ppos : (ME === 0 ? [1.6, 1.8] : [-1.6, 1.8]);
  P.pos.set(pp[0], 0, pp[1]); camTarget.set(pp[0], 0, pp[1]);
  W.helpers = []; syncHelpers();
  updatePack(0); updatePack(1); W.needDirty = true; planSig = ''; hudDirty = true; refreshGhosts();
}
function offlineProgress(){
  if (NET.role === 'guest' || !L('a_night') || !S.savedAt) return;
  const secs = Math.min(3600, (Date.now() - S.savedAt) / 1000); if (secs < 60) return;
  let rate = 0; if (L('a_dog')) rate += (1 + V('a_kennel')) / (V('a_dog') + 5); rate += 0.25 * (L('a_robot') >= 3 ? 2 : L('a_robot') ? 1 : 0); if (L('a_vacuum')) rate += VAC_RATE[L('a_vacuum')] * 0.5; if (L('a_drone')) rate += 0.15 * (L('a_drone') >= 3 ? 2 : 1);
  const alive = W.bricks.filter(b => b.alive && !b.gold); const n = Math.min(alive.length, Math.floor(secs * rate));
  if (!n) return;
  shuffle(alive, Math.random);
  for (let i = 0; i < n; i++) { const b = alive[i]; takeBrick(b); S.station[b.t]++; S.xp.auto++; }
  settleAllInstant(); crateFillUpdate(); W.needDirty = true; hudDirty = true;
  showModal(t('m.offline'), t('m.offlineB', { n:nB(n) }), [{ t:t('m.great'), primary:true, fn:() => {} }]);
}

/* ================= main loop ================= */
let running = false, last = performance.now(), saveT = 0, hudT = 0;
function step(dt, time){
  updatePlayer(dt); updateRemote(dt); updateXray(false);
  if (NET.role === 'guest') guestHelpers(dt); else hostSystems(dt);
  updateResidents(dt); settleUpdate(dt);
  if (S.order) S.order.left -= dt;
  marker.material.opacity = Math.max(0, marker.material.opacity - dt * 1.6); marker.scale.multiplyScalar(1 + dt * 0.6);
  const sb = W.buildings[SEL]; selRing.position.set(sb.ox, 0.04, sb.oz); selRing.scale.setScalar(Math.max(sb.hx, sb.hz) * 1.35 + 0.3); selRing.material.opacity = 0.35 + 0.2 * Math.sin(time * 3);
  const selB = W.buildings[SEL], remS = selB ? remainAll(selB) : null, plc = S.pl[ME].carry;
  W.crates.forEach((c, ci) => { let want = false; if (remS) for (let s3 = 0; s3 < 3; s3++) { const q = ci * 3 + s3; if (remS[q] > plc[q] && S.station[q] > 0) want = true; } c.g.position.y = 0.14 + (want ? Math.abs(Math.sin(time * 4 + ci)) * 0.06 : 0); });
  for (const c of W.crates) { c.h = lerp(c.h, c.ht, 1 - Math.exp(-8 * dt)); c.fill.scale.y = Math.max(0.001, c.h); c.fill.position.y = 0.05 + c.h / 2; }
  if (L('c_mail')) { $('#mailCd').style.width = P.mailCd > 0 ? (P.mailCd / V('c_mail') * 100) + '%' : '0%'; $('#bMail').disabled = P.mailCd > 0 || looseN(ME) === 0; }
  if (L('m_pulse')) { $('#pulseCd').style.width = P.pulseCd > 0 ? (P.pulseCd / PULSE_CD[L('m_pulse')] * 100) + '%' : '0%'; $('#bPulse').disabled = P.pulseCd > 0; }
  netTick(dt);
  hudT += dt; if (hudT > 0.2 || (hudDirty && hudT > 0.05)) { hudT = 0; refreshHUD(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
  drawMini(dt);
}
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const time = now / 1000;
  resize();
  if (W) { if (running) step(dt, time); updateTimers(dt); updateFlights(dt); updateParts(dt); updateHighlight(dt, time); ambient(dt, time); }
  updateCamera(dt);
  renderer.render(scene, camera);
  updateFloats(dt); updateLabels(dt); tutTick(dt, time);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
function boot(data){
  LOC = (data && data.LOC) ? { ...LDEF(), ...data.LOC } : loadLocal();
  LANG = LOC.lang || 'uk';
  const saved = (data && data.S) || loadSaved();
  if (saved) S = mergeState(saved);
  if (saved && S.stats.placed > 20 && LOC.tut < 7) LOC.tut = TUT.length;
  applyLang();
  enterDistrict(); refreshHUD();
  showStart(!!(saved && S.stats.collected > 0));
  requestAnimationFrame(frame);
}
addEventListener('visibilitychange', () => { if (document.hidden) { save(); saveLocal(); Music.pause(); AC && AC.suspend && AC.suspend(); } else { AC && AC.resume && AC.resume(); Music.resume(); } });
addEventListener('pagehide', () => { save(); saveLocal(); });
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => { if (W && NET.role !== 'guest') S.ppos = [P.pos.x, P.pos.z]; return { S:NET.role === 'guest' ? loadSaved() : JSON.parse(JSON.stringify(S)), LOC }; });
window.__sg = { get S(){ return S; }, get W(){ return W; }, get LOC(){ return LOC; }, P, act, apply, onTap, buildAction, nodeInfo, NODE, screenOf, walkTo, walkToStation, walkToBuilding, E, plN, enterDistrict, startGame, placeTap, nextPlaceable, startPlaceAll, getNeeds, requestCollect, refreshHUD, surplus, SELf:() => SEL, setSel:i => selectB(i), TUT, setLang, T,
  sim(sec){ let tt = performance.now() / 1000; for (let k = 0; k < sec * 30; k++) { tt += 1 / 30; step(1 / 30, tt); updateTimers(1 / 30); updateFlights(1 / 30); updateParts(1 / 30); ambient(1 / 30, tt); tutTick(1 / 30, tt); } } };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
